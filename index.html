<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first: lock scaling, disable zoom/pinch so touch controls feel native on iPad -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MaazGame" />
  <meta name="theme-color" content="#10131a" />

  <!-- PWA: manifest + iOS home-screen icon (iOS ignores the manifest icons). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <title>MaazGame — Grid RPG</title>
  <style>
    :root { --bg: #10131a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      /* Kill iOS Safari tap highlight / callouts for a game-like feel */
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Phaser injects its <canvas> here. Crisp pixel scaling on all engines. */
    #game-root canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>

  <!-- Phaser 3, vendored locally so the PWA installs and runs fully offline. -->
  <script src="vendor/phaser.min.js"></script>
</head>
<body>
  <div id="game-root"></div>
  <!-- Game code is ES modules under src/; main.js boots Phaser. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
