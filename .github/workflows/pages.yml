# Publish the game to GitHub Pages so it can be played from a URL — handy
# for testing on an iPad, where "Add to Home Screen" then installs the PWA.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify maps are in sync with their source
        run: |
          node tools/build-maps.mjs
          if ! git diff --quiet -- maps/; then
            echo "maps/ is out of date — run 'node tools/build-maps.mjs' and commit."
            git --no-pager diff --stat -- maps/
            exit 1
          fi

      # The game is already a static site: no build step, ship the folder.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
